# Harness-evolution confirmation: pre-registration.
# Plan: docs/plans/2026-10-15-harness-evolution-loop.md, §7.
# This file must be committed before the sealed validity gate runs. It must never be edited after any
# sealed-task outcome is observed. Corrections are dated addenda appended at the end.

[meta]
protocol = "a2-evolve-confirm-v2"
question = "Does the loop's champion genome beat the E1 a2-full configuration on unseen repositories?"
confirmation_window = ["2026-12-01", "2026-12-10"]
runs = 1   # exactly one confirmation run; no second test on this set

[dataset]
source = "ScaleAI/SWE-bench_Pro (V2 default config)"
revision = "2d52cb3df914a3fcf80c7f66738b3a88ae37fc50"
parquet_sha256 = "1067f72c1f43bbc578276888625db3b836cebb535546c9eaf824c5d5dd104a7f"
subset = "repo in {internetarchive/openlibrary, qutebrowser/qutebrowser} and |fail_to_pass| >= 2"
storage = "A2_E1_HOME=~/.a2-e1/sealed (private/ and work/ under it); denied to every agent, policy and researcher sandbox"
validity_gate = "hardened grader (bench/evolve/hardened.py): gold resolves AND empty does not; setup errors exclude"
selection_seed = 20261201
order = "gated tasks sorted by sha256('a2-evolve-v2:' + opaque_id)"
calibration_size = 5            # first 5 in order; raw arm only; excluded from the sample
max_sample = 100                # next up to 100 in order; if more than 100 gate, take per-repo shares proportional to gate yield
reserve = "the remaining gated tasks, in order, for infra replacement"
minimum_sample = 40             # below this, extend the subset to the Go repos (flipt, vuls) by dated addendum before any agent run
report_as = "issue-only variant of native-graded SWE-Bench Pro V2 (openlibrary + qutebrowser); never as SWE-Bench Pro scores"

[calibration]
arm = "raw (a2ctl run --attempts 1 --lineage-db none), issue-only, effort high"
rule = "informational smoke test of the new repos; no instruction or budget change follows. Raw >= 4/5 is reported as a ceiling warning, 0/5 as a floor warning."

[environment]
grading = "native, hardened: Seatbelt-sandboxed pytest (no network; reads limited to the venv, its base Python, the tree and frozen config), audit_diff rejection rules, frozen base-repo pytest config via -c, plugin autoload disabled, junit exactly-once checks"
python = "base year <= 2021 -> 3.9, 2022 -> 3.10, >= 2023 -> 3.11"
dependencies = "two-stage as in E1: --exclude-newer <base date + 1 day>, else same files unpinned; qutebrowser fallback constrained to PyQt5<5.16; openlibrary vendor/infogami submodule at its pinned commit"
checkout = "history-free single root commit, no remotes; fresh copy per arm and per agent call"
resolution = "all fail_to_pass ∪ pass_to_pass pass after reverting agent test-path edits and applying test_patch"

[arms]
primary = ["champion", "a2-full"]
secondary = ["G0"]   # champion vs G0, reported, not decisive
order = "per-task permutation from random.Random(arm_order_seed)"
arm_order_seed = 1201
provider = "codex/gpt-6-luna"
instruction = "issue-only"
champion = "the current champion genome at 2026-11-30T23:59Z; its git commit and genome sha256 are recorded here by dated addendum before the first sealed agent run. If the champion is G0, no confirmation is run (plan §1(b) applies)."
champion_budget = "at most 3 agent calls of a2ctl run --attempts 1 --lineage-db none; 1500 s per call; effort in {low, medium, high}; max_tokens 2000000 per call, non-binding"
a2_full = "a2ctl run --attempts 3, fresh lineage db per (task, arm), --verifier-feedback raw, effort high, timeout 1500 s per attempt, max_tokens 2000000 per attempt, non-binding (E1 configuration)"
a2_full_visible_feedback = "the hardened visible verifier rendered as text (bench/evolve), not E1's unsandboxed verify.py: the same evaluator information as the champion, and no unsandboxed code execution next to sealed material"
g0 = "seed genome G0 (stateless retry as a policy), same budget as the champion"
codex_homes = "separate isolated CODEX_HOME for confirmation agents; memories off; sessions purged after each episode"
shards = 4

[metric]
primary = "resolved rate, champion vs a2-full, paired by task"
test = "exact one-sided McNemar on discordant pairs"
promote = "one-sided p <= 0.05 (which implies champion wins more discordant pairs)"
no_promotion = "p > 0.05, or infrastructure exclusions > 20% of the sample"
power_note = "at a 4% baseline-only win rate: n=80 -> power 0.61 for +10 pp, 0.87 for +15 pp; n=100 -> 0.72 / 0.93. A failed confirmation is reported with this table, never as 'no effect'."
secondary = ["hidden-half resolution", "champion vs G0", "a2-full vs G0", "tokens and wall-clock per arm", "per-repo breakdown"]

[integrity]
pre_run_audit = "before the confirmation run, an LLM audit of the champion genome and of a sample of its resolved dev diffs, looking for grader tampering; findings are recorded by addendum before the run"
leak_check = "hidden ids (whole-id match) and gold-patch content never appear in any agent- or policy-visible payload"
stop = ["any evidence of a sealed-path read or non-allowlisted egress success", "provider account exhausted mid-run (resume only with the same provider/model)"]

[infrastructure_failures]
taxonomy = ["a2ctl_failed", "no_attempt_row", "provider_error (an agent call with 0 tokens in and out)", "grader_error", "setup_error", "policy_sandbox_error"]
not_infrastructure = ["agent timeout", "empty diff", "diff does not apply", "grade_rejected (audit rule)", "verification failure", "policy crash or invalid action (treated as submit-last)"]
rule = "an infra-failed (task, arm) is retried once; if it fails again, the task is dropped for all arms and replaced by the next reserve task"

[no_tuning]
rule = "the sealed set is never used for screening, never re-run with changed genomes, prompts, budgets or providers after outcomes are observed"

# --- Addendum 2026-10-16 (before any sealed-task agent run; only the validity gate has run) ---
# The first sealed gate yielded 28 of 125 (openlibrary 28, qutebrowser 0), below minimum_sample.
# Every failure was environmental and fixed by rule, the same for every task:
#  - qutebrowser: 44 tasks had setup errors. The lockfiles pin x86-only wheels, so install stages 2-3
#    now use the unpinned *-raw sources (date-pinned, then unpinned), constrained to PyQt5<5.16.
#  - qutebrowser: 19 tasks had gold unresolved. Explicit -p plugins imported xdist twice, and
#    filterwarnings=error aborted the run. The grader now autoloads pytest plugins from the read-only
#    venv, as E1 did, and audit_diff rejects package metadata (.dist-info, .egg-info, entry_points.txt).
#  - openlibrary: the conftest failed to parse because the year rule chose Python 3.11 where the repo
#    pins 3.12. Python now comes from the repo's docker/ `FROM python:X.Y` when present.
# The whole sealed pool (all 125) is re-gated with the final grader, and the sample is drawn from that
# gate under the selection rule above, unchanged. Nothing else in this file changes.
[addendum_2026_10_16]
python = "openlibrary: version from docker/ FROM python:X.Y; others: base-year rule"
dependencies = "stage 1 as before; for lockfile repos (qutebrowser) stages 2-3 use *-raw sources: --exclude-newer, then unpinned, both with PyQt5<5.16 constraints"
grading = "pytest plugins autoloaded from the read-only venv (PYTEST_DISABLE_PLUGIN_AUTOLOAD removed); candidate diffs adding package metadata are rejected"
regate = "all 125 sealed tasks re-gated with the final grader; the first gate's results are superseded"
# 2026-10-16, still before any sealed agent run: the second re-gate was stopped at 84/125. The grader
# bootstrap dropped a profile's "." import root, and the qutebrowser fallback built old PyQt sdists.
# Fixed by rule (import roots restored after pytest is pinned; PyQt wheels only), and the pool is
# re-gated from scratch a third time.
regate_2 = "pool re-gated a third time after the import-root and PyQt-wheel fixes; earlier gates superseded"

# --- Addendum 2026-10-17 (after the raw calibration run on the 5 calibration tasks; before any agent run on
# the sample) ---
# An evaluator audit found that a candidate could forge junit results, for example from an atexit hook. The
# grader now counts a junit pass only when a live report stream confirms it. The stream comes from the guard
# plugin, which writes each test phase and then an END marker to an inherited pipe. Tampering, or records
# written after END, void every pass in the run. This makes the grader stricter only; no rule is relaxed.
# All 46 gated tasks were re-gated under this grader, with this result:
#  - 46/46 pass (gold resolves, empty does not), recorded in
#    docs/benchmark-results/evolve/sealed-strict-gate.json;
#  - the gated set is unchanged, so calibration (5), sample (41) and reserve (0) stand, as drawn in
#    docs/benchmark-results/evolve/sealed-sample.json.
# The calibration result (raw 0/5) was graded by the earlier grader. It is informational, and it stands.
# The confirmation run uses this grader for every arm.
[addendum_2026_10_17]
grading = "junit passes count only when confirmed by the guard plugin's live report stream (evaluator sha256 6ab0fe7e...)"
regate_3_strict = "46/46 gated tasks re-gated under the stream-confirmed grader; all pass; selection unchanged"
order_note = "this change was made after the calibration run and before any sample-task agent run"
