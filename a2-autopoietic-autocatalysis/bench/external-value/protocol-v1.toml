# E1 pre-registration. Committed before the first non-calibration provider call.
# Plan: docs/plans/2026-10-14-value-test-first.md (+ addenda). Must be committed before the first
# non-calibration provider call and never edited after outcomes are observed (dated addenda only).

[meta]
protocol = "a2-e1-v1"
question = "Does the full A² loop beat stateless retry with identical verifier feedback?"
decision_deadline = "2026-11-30"

[dataset]
source = "ScaleAI/SWE-bench_Pro (V2 default config)"
revision = "2d52cb3df914a3fcf80c7f66738b3a88ae37fc50"
parquet_sha256 = "1067f72c1f43bbc578276888625db3b836cebb535546c9eaf824c5d5dd104a7f"
subset = "repo == ansible/ansible and |fail_to_pass| >= 2"
validity_gate = "native grader: gold patch resolves AND empty patch does not; setup errors exclude"
gate_summary = "docs/benchmark-results/external-value/e1/gate-summary.json"   # opaque ids only
split_seed = 20261014
calibration_size = 5
gate_result = "44 of 68 passed (29 date-pinned, 15 unpinned-fallback install)"
max_sample = 36
reserve_size = 3
sample_file = "docs/benchmark-results/external-value/e1/sample.json"   # opaque ids, order = run order

[calibration]
# raw arm on the 5 calibration tasks (excluded from the sample); rows under ~/.a2-e1/private/runs/
runs = [
  "calib-1: full instruction, effort high -> 5/5",
  "calib-2-low: full instruction, effort low -> 4/5",
  "calib-3-minimal: provider rejection (gpt-6-luna does not support minimal); not a data point",
  "calib-4-none: full instruction, effort none -> 5/5",
  "calib-5-issue-only: issue-only instruction, effort high -> 1/5 (locked: within pre-stated 1-3 band)",
]
report_as = "issue-only variant of native-graded SWE-Bench Pro V2 (ansible subset); never as SWE-Bench Pro scores"

[environment]
grading = "native (no containers on this host; see docs/blockers/2026-10-14-no-container-runtime.md)"
python = "base year <= 2021 -> 3.9, 2022 -> 3.10, >= 2023 -> 3.11"
dependencies = "two-stage: uv pip install --exclude-newer <base date + 1 day>, else same files unpinned; requirements.txt + first existing unit requirements file + pytest pytest-mock mock"
checkout = "shallow fetch of base_commit, re-initialized as a single root commit, no remotes; fresh copy per arm and per stateless attempt"
resolution = "all fail_to_pass ∪ pass_to_pass pass after reverting agent test-path edits and applying test_patch (official test.sh rule)"

[arms]
names = ["raw", "stateless-retry", "a2-full"]
order = "per-task permutation from random.Random(arm_order_seed)"
arm_order_seed = 1014
attempts_k = 3                   # raw uses 1
provider = "codex/gpt-6-luna"    # owner direction; isolated CODEX_HOME bench/e1/codex-home.config.toml
reasoning_effort = "high"         # A2_CODEX_REASONING_EFFORT, identical for every arm
instruction = "issue-only"        # problem statement only; requirements/interface withheld from every arm
max_tokens_per_attempt = 2000000  # non-binding ceiling (Codex input counts include cached context)
timeout_secs_per_attempt = 1500
shards = 3                        # parallel driver processes over disjoint task subsets
final_candidate = "first attempt whose visible verification passed, else the last attempt"

[feedback]
visible_split = "fail_to_pass sorted by sha256(test id); visible = first floor(n/2), hidden = rest"
signal = "bench/e1/verify.py: visible fail_to_pass + pass_to_pass on a reverted copy; output never names hidden tests"
stateless_carrier = "previous attempt's verifier output appended to the problem statement; fresh task id; --lineage-db none"
a2_full = "a2ctl run --attempts k, fresh lineage db per (task, arm), --verifier-feedback raw"

[boundary]
agent_network = "Seatbelt deny network* except localhost:<egress proxy>; proxy tunnels only chatgpt.com:443 and auth.openai.com:443"
agent_tools = "Codex with web_search disabled and apps/plugins/remote_plugin/in_app_browser/skill MCP features off (bundled system skills remain)"
agent_files = "Seatbelt deny file-read*/file-write* under ~/.a2-e1/private (manifests, patches, venvs, dataset, run rows)"
leak_check = "driver asserts no private path / gold prefix / hidden test id appears in any agent-visible payload"

[metric]
primary = "resolved rate, a2-full vs stateless-retry, paired by task"
test = "exact one-sided McNemar on discordant pairs"
go = "observed difference >= +15 percentage points AND one-sided p <= 0.10"
no_go = "observed difference < +15 pp"
inconclusive = "difference >= +15 pp but p > 0.10, or infrastructure exclusions > 20% of sample; INCONCLUSIVE counts as NO GO"
secondary = ["hidden-half resolution (hidden fail_to_pass ∪ pass_to_pass)", "raw vs stateless-retry", "raw vs a2-full", "tokens and wall-clock per arm"]

[infrastructure_failures]
taxonomy = ["a2ctl_failed (nonzero exit, no attempt row)", "no_attempt_row", "provider_error (an attempt with 0 tokens in and out)", "grader_error (grade raised)", "setup_error"]
not_infrastructure = ["agent timeout", "empty diff", "diff does not apply", "verification failure"]
rule = "an infra-failed (task, arm) is retried once; if it fails again, the task is dropped for all arms and replaced by the next reserve task in order"

[stop]
conditions = ["decision deadline reached", "any evidence of private-path read or non-allowlisted egress success", "provider account exhausted mid-run (resume only with the same provider/model)"]
no_tuning = "the sample is never re-run with changed prompts, budgets or providers after outcomes are observed"
